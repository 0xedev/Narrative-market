services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - graph-postgres:/var/lib/postgresql/data

  ipfs:
    image: ipfs/kubo:v0.17.0
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8080:8080"

  graph-node:
    image: graphprotocol/graph-node:v0.35.1
    restart: unless-stopped
    depends_on:
      - postgres
      - ipfs
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: ipfs:5001
      ethereum: robinhood-testnet:https://rpc.testnet.chain.robinhood.com
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: "true"
      GRAPH_LOG: info
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"

volumes:
  graph-postgres:
