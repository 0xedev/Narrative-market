specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: NarrativeThrone
    network: robinhood
    source:
      address: "0x3953b9730A264C477c579B8dF7F84D30B013f99a"
      abi: NarrativeThrone
      startBlock: 43499170
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - Question
        - Answer
        - Takeover
        - Proposal
        - Reward
        - Payout
      abis:
        - name: NarrativeThrone
          file: ./abis/NarrativeThrone.json
      eventHandlers:
        - event: QuestionProposed(indexed bytes32,indexed address,string,uint256)
          handler: handleQuestionProposed
        - event: QuestionQueued(indexed bytes32,indexed address,string)
          handler: handleQuestionQueued
        - event: QuestionStarted(indexed bytes32,indexed address,string,uint256,uint256,uint256)
          handler: handleQuestionStarted
        - event: QuestionRotated(indexed bytes32,indexed bytes32,indexed address,string)
          handler: handleQuestionRotated
        - event: QuestionResolved(indexed bytes32,indexed bytes32,address,uint256)
          handler: handleQuestionResolved
        - event: CarryoverAnswerSubmitted(indexed bytes32,indexed address,indexed bytes32,string,uint256)
          handler: handleCarryoverAnswerSubmitted
        - event: Takeover(indexed bytes32,indexed address,indexed address,uint256,bytes32,string,uint256)
          handler: handleTakeover
        - event: RewardsMinted(indexed bytes32,indexed address,uint256)
          handler: handleRewardsMinted
        - event: PayoutDistributed(indexed bytes32,indexed address,indexed address,address,uint256,uint256,uint256)
          handler: handlePayoutDistributed
      file: ./src/narrative-throne.ts
