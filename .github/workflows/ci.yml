name: Narrative Markets CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install --no-git oz=OpenZeppelin/openzeppelin-contracts@v5.0.2
      - run: forge install --no-git foundry-rs/forge-std
      - run: forge test --fuzz-runs 1000 -vvv

  web-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @narrative/web typecheck
      - run: pnpm --filter @narrative/web build
      - run: pnpm subgraph:codegen
      - run: pnpm subgraph:build
